{% extends "base.html" %}

{% block title %}Login — Spendly{% endblock %}

{% block content %}

<section class="auth-section auth-section-login">
    <div class="auth-card-login">

        <div class="auth-header-login">
            <h1 class="auth-title-login">Welcome Back!</h1>
            <p class="auth-subtitle-login">Login to continue</p>
        </div>

        {% if error %}
        <div class="auth-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login" class="auth-form-login">
            <div class="form-group">
                <label for="email">Username</label>
                <input type="email" id="email" name="email"
                       class="form-input" placeholder="Enter your username"
                       required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       class="form-input" placeholder="Enter your password"
                       required>
            </div>
            <a href="#" class="forgot-password-link">Forgot Password?</a>
            <button type="submit" class="btn-submit">Login</button>
        </form>

    </div>
</section>

{% endblock %}
